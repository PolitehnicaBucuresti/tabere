services:
  web:
    build: .
    # Inject SMTP_* and other secrets at runtime (host .env next to this file).
    env_file:
      - .env
    environment:
      NODE_ENV: production
    # Routed by Traefik — no host ports needed (see bottom for optional debug publish).
    networks:
      - traefik
    labels:
      - traefik.enable=true
      # Must match the real Docker network name Traefik uses (see `docker network ls`).
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik_default}
      # Public hostname — set TABERE_HOST in .env if different from tabere.upb.ro
      - traefik.http.routers.tabere.rule=Host(`${TABERE_HOST:-tabere.upb.ro}`)
      - traefik.http.routers.tabere.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.tabere.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.tabere.service=tabere
      - traefik.http.services.tabere.loadbalancer.server.port=3000

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_default}

# Optional: expose Next directly on the VM for debugging (bypass Traefik):
#   docker compose --profile debug up -d
# profiles:
#   debug:
#     ports:
#       - "127.0.0.1:3000:3000"

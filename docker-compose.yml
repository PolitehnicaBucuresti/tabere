services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tabere
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tabere_change_me}
      POSTGRES_DB: tabere
    volumes:
      - tabere_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabere -d tabere"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # Dev: Prisma CLI de pe host (migrate dev) → 127.0.0.1:5432
    # Dacă ai Postgres local pe 5432, folosește 127.0.0.1:5433:5432 și port 5433 în DATABASE_URL.
    ports:
      - "127.0.0.1:5432:5432"
    # Limite container (standalone docker compose — vezi README)
    cpus: "${DB_CONTAINER_CPUS:-0.50}"
    mem_limit: ${DB_CONTAINER_MEMORY:-512m}
    mem_reservation: ${DB_CONTAINER_MEMORY_RESERVED:-128m}

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # Inject SMTP_* and other secrets at runtime (host .env next to this file).
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tabere:${DB_PASSWORD:-tabere_change_me}@db:5432/tabere?schema=public
    # Routed by Traefik — no host ports needed.
    networks:
      - internal
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik_default}
      - traefik.http.routers.psc-tabere.rule=Host(`${TABERE_HOST:-tabere.upb.ro}`)
      - traefik.http.routers.psc-tabere.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.psc-tabere.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.psc-tabere.service=psc-tabere-svc
      - traefik.http.services.psc-tabere-svc.loadbalancer.server.port=3000
    # Limite container (Next.js + Node); ajustezi după RAM/CPU disponibile pe VM
    cpus: "${WEB_CONTAINER_CPUS:-1.0}"
    mem_limit: ${WEB_CONTAINER_MEMORY:-1024m}
    mem_reservation: ${WEB_CONTAINER_MEMORY_RESERVED:-256m}
    pids_limit: 512

networks:
  internal:
    driver: bridge
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_default}

volumes:
  tabere_pgdata:
